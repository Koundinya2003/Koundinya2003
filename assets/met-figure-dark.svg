<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-label="Panel A: variance in ratings. Valence 4 percent person, 49 percent song, 47 percent personal reaction. Arousal 4 percent person, 67 percent song, 29 percent personal reaction. Panel B: preregistered confirmatory tests. H1 arousal to posterior alpha, beta -0.08, 95% CI -0.24 to 0.08, p = .33. H2 valence to frontal alpha asymmetry, beta 0.06, 95% CI -0.10 to 0.22, p = .45. Both intervals include zero. H3 chi-squared(1) = 1.8, p = .18.">
<title>MET EEG study — rating variance and confirmatory test results</title>
